<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:616px;height:1024px;overflow:hidden;background:transparent}
.panel{
  width:616px;
  height:1024px;
  border-radius:24px;
  background:#121217;
  border:2px solid #2a2a32;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
}
.header{
  position:absolute;
  left:28px;
  right:28px;
  top:0;
  height:76px;
}
.line{
  position:absolute;
  left:28px;
  right:28px;
  top:76px;
  height:2px;
  background:#2e2e38;
}
</style>
</head>
<body>
<div class="panel">
  <div class="header"></div>
  <div class="line"></div>
</div>
</body>
</html>
