<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscape Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#b02cf0;--red:#ff2a2a;--side:#575757;--main:#181818;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#0c0c0c;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff}
.win{position:relative;width:100%;max-width:1100px;aspect-ratio:1.42;max-height:96vh;border-radius:28px;overflow:hidden;display:flex;background:var(--main);box-shadow:0 0 60px rgba(176,44,240,.25);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.side{position:relative;width:20.5%;min-width:170px;background:var(--side);display:flex;flex-direction:column;padding:10px 8px 14px;z-index:1}
.logo{position:relative;height:90px;margin-bottom:18px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-1deg)}}
.crown{position:absolute;left:0;top:-6px;font-size:22px;filter:drop-shadow(0 0 6px var(--purple));animation:crown 2.5s ease-in-out infinite}
@keyframes crown{50%{transform:rotate(-12deg) translateY(-3px)}}
.logo .a,.logo .b{font-family:'Permanent Marker',cursive;position:absolute;white-space:nowrap}
.logo .a{left:6px;top:14px;font-size:clamp(24px,3.4vw,40px);color:#fff;text-shadow:0 0 8px #fff,0 0 18px #d58bff;animation:glowW 2.4s ease-in-out infinite}
.logo .b{right:2px;top:44px;font-size:clamp(22px,3.2vw,38px);color:var(--purple);text-shadow:0 0 10px var(--purple),0 0 24px var(--purple);animation:glowP 1.8s ease-in-out infinite}
@keyframes glowW{50%{text-shadow:0 0 14px #fff,0 0 30px #d58bff}}
@keyframes glowP{50%{text-shadow:0 0 18px var(--purple),0 0 40px var(--purple);filter:brightness(1.3)}}
nav{display:flex;flex-direction:column;gap:6px}
.tab{background:none;border:0;color:#ddd;font:600 14px Inter,sans-serif;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;position:relative;opacity:0;transform:translateX(-24px);animation:slide .5s forwards;transition:background .25s,color .25s,padding .25s}
.tab:nth-child(1){animation-delay:.5s}.tab:nth-child(2){animation-delay:.6s}.tab:nth-child(3){animation-delay:.7s}.tab:nth-child(4){animation-delay:.8s}
@keyframes slide{to{opacity:1;transform:none}}
.tab:hover{background:rgba(255,255,255,.1);padding-left:18px}
.tab.on{background:linear-gradient(90deg,rgba(176,44,240,.55),rgba(176,44,240,.05));color:#fff;box-shadow:inset 3px 0 var(--purple)}
.ver{margin-top:auto;font-weight:800;font-size:14px;padding-left:6px}
.ver::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:#3dff7a;box-shadow:0 0 8px #3dff7a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.main{position:relative;flex:1;z-index:1;padding:5% 6%}
.user{position:absolute;right:6%;top:3%;display:flex;align-items:center;gap:10px;animation:fromTop .8s .3s both}
@keyframes fromTop{from{opacity:0;transform:translateY(-30px)}}
.name{text-align:right;line-height:1;font-weight:800}
.name b{display:block;color:var(--purple);font-size:clamp(18px,2.3vw,26px);text-shadow:0 0 10px rgba(176,44,240,.6)}
.name span{color:var(--red);font-size:clamp(14px,1.8vw,20px)}
.avatar{width:clamp(56px,7vw,82px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,4vw,46px);background:radial-gradient(circle,#ddd,#888);position:relative;box-shadow:0 0 18px var(--purple),0 0 36px rgba(176,44,240,.6);animation:pulse 2s infinite}
.avatar::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--purple);border-right-color:var(--red);animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 28px var(--purple),0 0 56px rgba(176,44,240,.8)}}
.panel{margin-top:14%;max-width:520px;display:none;flex-direction:column;gap:10px}
.panel.on{display:flex}
.row{display:flex;justify-content:space-between;align-items:center;background:#232323;border:1px solid #2f2f2f;border-radius:12px;padding:13px 16px;font-weight:600;opacity:0;transform:translateY(14px);animation:slide .45s forwards;transition:border-color .25s,transform .25s}
.row:hover{border-color:var(--purple);transform:translateX(6px)}
.panel.on .row:nth-child(2){animation-delay:.08s}.panel.on .row:nth-child(3){animation-delay:.16s}.panel.on .row:nth-child(4){animation-delay:.24s}
.sw{width:44px;height:24px;border-radius:99px;background:#444;position:relative;cursor:pointer;transition:.3s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s}
.sw.on{background:var(--purple);box-shadow:0 0 12px var(--purple)}
.sw.on::after{left:23px}
</style>
</head>
<body>
<div class="win">
  <canvas id="c"></canvas>
  <aside class="side">
    <div class="logo"><span class="crown">👑</span><span class="a">Buscape</span><span class="b">MENU</span></div>
    <nav id="nav">
      <button class="tab on" data-p="0">Player</button>
      <button class="tab" data-p="1">Visual</button>
      <button class="tab" data-p="2">Combate</button>
      <button class="tab" data-p="3">Misc</button>
    </nav>
    <div class="ver">Versão: Beta do Menu</div>
  </aside>
  <main class="main">
    <div class="user">
      <div class="name"><b>Client</b><span>seu gay</span></div>
      <div class="avatar">🐱</div>
    </div>
    <div id="panels"></div>
  </main>
</div>
<script>
const data=[["God Mode","Velocidade","Pulo alto"],["ESP","Nomes","Linhas"],["Aimbot","Auto tiro","Sem recuo"],["Teleporte","Clima","Tema neon"]];
const P=document.getElementById('panels');
data.forEach((items,i)=>{const d=document.createElement('div');d.className='panel'+(i==0?' on':'');
 d.innerHTML=items.map(t=>`<div class="row">${t}<div class="sw"></div></div>`).join('');P.appendChild(d)});
P.addEventListener('click',e=>{if(e.target.classList.contains('sw'))e.target.classList.toggle('on')});
document.getElementById('nav').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('on',i==t.dataset.p))});
// particles
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}rs();addEventListener('resize',rs);
const ps=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2+.5,v:Math.random()*.0007+.0002}));
(function f(){x.clearRect(0,0,W,H);
 ps.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=1;p.x=Math.random()}
  x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fillStyle='rgba(176,44,240,.55)';x.shadowColor='#b02cf0';x.shadowBlur=8;x.fill()});
 requestAnimationFrame(f)})();
</script>
</body>
</html>
