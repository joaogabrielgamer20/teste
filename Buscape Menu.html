<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscape Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#b02cf0;--red:#ff2a2a;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent}
body{background:transparent;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px}
.win{position:relative;width:100%;max-width:1200px;aspect-ratio:2455/1748;max-height:96vh;border-radius:2.2% / 3%;overflow:hidden;background:linear-gradient(90deg,transparent 20.3%,#181818 20.3%);animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.9);opacity:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.side{position:absolute;left:0;top:0;bottom:0;width:20.3%;background:rgba(14,14,14,.7);backdrop-filter:blur(2px)}
.logo{position:absolute;left:0;top:0;width:100%;animation:float 4s ease-in-out infinite,glow 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-.8deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px rgba(176,44,240,.4))}50%{filter:drop-shadow(0 0 14px rgba(176,44,240,.95)) brightness(1.12)}}
.ver{position:absolute;left:6%;bottom:2.2%;color:#fff;font-weight:800;font-size:clamp(11px,1.6vw,19px);animation:fade 1s .5s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.user{position:absolute;right:5.6%;top:3%;display:flex;align-items:center;gap:1.2vw;animation:drop .8s .3s both}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}}
.name{line-height:1;font-weight:800;text-align:left}
.name b{display:block;color:var(--purple);font-size:clamp(14px,2.1vw,26px);text-shadow:0 0 10px rgba(176,44,240,.55)}
.name span{color:var(--red);font-size:clamp(12px,1.7vw,21px)}
.av{position:relative;width:clamp(48px,6.1vw,76px);aspect-ratio:1;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.av img{width:100%;height:100%;border-radius:50%;display:block}
.av::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--purple);border-right-color:var(--red);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 14px var(--purple),0 0 30px rgba(176,44,240,.5)}50%{box-shadow:0 0 24px var(--purple),0 0 52px rgba(176,44,240,.85)}}
</style>
</head>

const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}rs();addEventListener('resize',rs);
const ps=Array.from({length:30},()=>({x:.22+Math.random()*.78,y:Math.random(),r:Math.random()*1.8+.5,v:Math.random()*.0006+.0002}));
(function f(){x.clearRect(0,0,W,H);
 ps.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=1;p.x=.22+Math.random()*.78}
  x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fillStyle='rgba(176,44,240,.4)';x.shadowColor='#b02cf0';x.shadowBlur=8;x.fill()});
 requestAnimationFrame(f)})();
</script>
