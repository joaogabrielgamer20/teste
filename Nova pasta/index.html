<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:336px;height:88px;overflow:hidden;background:transparent}
svg{width:336px;height:88px;display:block}
.wrap{position:relative;width:336px;height:88px}
.sheen{
  position:absolute;inset:0;border-radius:18px;pointer-events:none;overflow:hidden;
}
.sheen::after{
  content:"";
  position:absolute;
  top:-20%;
  left:-60%;
  width:46%;
  height:140%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg);
  animation:sheen 1.8s ease-in-out infinite;
}
@keyframes sheen{
  0%{left:-70%;opacity:0}
  18%{opacity:1}
  55%{left:120%;opacity:.4}
  100%{left:120%;opacity:0}
}
.bar{
  position:absolute;
  right:10px;
  top:50%;
  width:12px;
  height:48px;
  margin-top:-24px;
  border-radius:6px;
  background:#C45CFF;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scaleY(1)}
  50%{opacity:.7;transform:scaleY(.86)}
}
</style>
</head>
<body>
<div class="wrap">
  <svg xmlns="http://www.w3.org/2000/svg" width="336" height="88" viewBox="0 0 336 88">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#A02DFF"/>
        <stop offset="46%" stop-color="#4B1578"/>
        <stop offset="100%" stop-color="#16081F"/>
      </linearGradient>
    </defs>
    <rect width="336" height="88" rx="18" fill="url(#g)"/>
  </svg>
  <i class="sheen"></i>
  <i class="bar"></i>
</div>
</body>
</html>
