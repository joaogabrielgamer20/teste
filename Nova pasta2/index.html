<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Button Selector</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:270px;
  height:40px;
  overflow:hidden;
  background:transparent;
}
.sel{
  box-sizing:border-box;
  width:270px;
  height:40px;
  border-radius:10px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(90deg,#9a121c 0%,#3a1216 48%,#1a1214 100%);
}
.bar{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:18px;
  border-radius:2px;
  background:#e11d2e;
}
</style>
</head>
<body>
<div class="sel"><i class="bar"></i></div>
</body>
</html>
